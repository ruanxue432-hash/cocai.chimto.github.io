<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Downloader - Tải video không logo</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b1a;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1a3e 0%, #0b0b1a 70%);
            padding: 20px;
        }

        /* ===== CARD CHÍNH ===== */
        .container {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 40px 32px 48px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(255, 0, 80, 0.3);
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 2px;
            font-weight: 400;
        }

        /* ===== INPUT ===== */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 200px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        .input-group input:focus {
            border-color: rgba(255, 0, 80, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(255, 0, 80, 0.1);
        }

        .input-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff0050, #d4006e);
            color: #fff;
            box-shadow: 0 8px 24px rgba(255, 0, 80, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 0, 80, 0.4);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #00c851, #00e676);
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 200, 80, 0.3);
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 200, 80, 0.4);
        }

        .btn-success:active:not(:disabled) {
            transform: translateY(0px);
        }

        .btn-success:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-outline:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ===== TRẠNG THÁI ===== */
        .status {
            min-height: 28px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .status .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ff0050;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status.loading .spinner {
            display: inline-block;
        }

        .status.error {
            color: #ff6b6b;
        }

        .status.success {
            color: #69db7c;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== VIDEO ===== */
        .video-wrapper {
            display: none;
            margin-top: 8px;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .video-wrapper.show {
            display: block;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-wrapper video {
            width: 100%;
            display: block;
            aspect-ratio: 9 / 16;
            background: #000;
            object-fit: contain;
        }

        /* ===== THÔNG TIN VIDEO ===== */
        .video-info {
            display: none;
            padding: 20px 0 8px;
            color: #fff;
        }

        .video-info.show {
            display: block;
            animation: fadeUp 0.4s ease forwards;
        }

        .video-info .title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-info .author {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-info .author::before {
            content: '@';
            opacity: 0.6;
        }

        /* ===== HÀNH ĐỘNG ===== */
        .actions {
            display: none;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .actions.show {
            display: flex;
            animation: fadeUp 0.4s ease forwards;
        }

        .actions .btn {
            flex: 1;
            min-width: 140px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            font-weight: 300;
        }

        .footer .badge {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .footer .badge span {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                padding: 24px 18px 32px;
                border-radius: 28px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 13px;
            }

            .input-group input {
                font-size: 15px;
                padding: 14px 16px;
            }

            .btn {
                padding: 14px 22px;
                font-size: 15px;
            }

            .video-info .title {
                font-size: 16px;
            }

            .actions .btn {
                min-width: 100%;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 18px 12px 24px;
                border-radius: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input {
                min-width: unset;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .header .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="logo-icon">🎵</div>
            <div>
                <h1>TikTok <span>Downloader</span></h1>
                <p>Dán link &amp; tải video không logo</p>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-group">
            <input
            id="urlInput"
            type="url"
            placeholder="https://www.tiktok.com/@user/video/123456789"
            autocomplete="off"
            spellcheck="false"
            />
            <button id="fetchBtn" class="btn btn-primary">🔍 Lấy video</button>
        </div>

        <!-- STATUS -->
        <div id="status" class="status">
            <span class="spinner"></span>
            <span id="statusText">Nhập link TikTok và nhấn "Lấy video"</span>
        </div>

        <!-- VIDEO -->
        <div id="videoWrapper" class="video-wrapper">
            <video id="videoPlayer" controls preload="metadata" playsinline></video>
        </div>

        <!-- VIDEO INFO -->
        <div id="videoInfo" class="video-info">
            <div class="title" id="videoTitle"></div>
            <div class="author" id="videoAuthor"></div>
        </div>

        <!-- ACTIONS -->
        <div id="actions" class="actions">
            <button id="downloadBtn" class="btn btn-success">⬇️ Tải video (không logo)</button>
            <button id="copyBtn" class="btn btn-outline">📋 Sao chép link</button>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <p>⚡ Tải video TikTok chất lượng HD, loại bỏ watermark</p>
            <div class="badge">
                <span>miễn phí</span>
                <span>không logo</span>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  DOM refs
        // ============================================================
        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const videoWrapper = document.getElementById('videoWrapper');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoInfo = document.getElementById('videoInfo');
        const videoTitle = document.getElementById('videoTitle');
        const videoAuthor = document.getElementById('videoAuthor');
        const actions = document.getElementById('actions');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');

        // ============================================================
        //  State
        // ============================================================
        let currentVideoUrl = null; // URL không logo
        let currentVideoData = null; // dữ liệu đầy đủ từ API

        // ============================================================
        //  Helpers
        // ============================================================
        function setStatus(message, type = '') {
            statusText.textContent = message;
            statusEl.className = 'status';
            if (type) statusEl.classList.add(type);
        }

        function setLoading(loading) {
            if (loading) {
                fetchBtn.disabled = true;
                fetchBtn.textContent = '⏳ Đang xử lý...';
                statusEl.classList.add('loading');
            } else {
                fetchBtn.disabled = false;
                fetchBtn.textContent = '🔍 Lấy video';
                statusEl.classList.remove('loading');
            }
        }

        function showVideo(data) {
            const videoUrl = data.play || data.wmplay || data.hdplay || data.play_url;
            if (!videoUrl) {
                setStatus('❌ Không tìm thấy link video trong dữ liệu trả về.', 'error');
                return false;
            }

            currentVideoUrl = videoUrl;
            currentVideoData = data;

            // Gán video
            videoPlayer.src = videoUrl;
            videoPlayer.load();

            // Hiển thị wrapper
            videoWrapper.classList.add('show');

            // Thông tin
            const title = data.title || data.desc || 'Video TikTok';
            const author = data.author?.unique_id || data.author?.nickname || data.author_name || 'unknown';
            videoTitle.textContent = title;
            videoAuthor.textContent = author;
            videoInfo.classList.add('show');

            // Actions
            actions.classList.add('show');

            setStatus('✅ Đã tải video thành công!', 'success');
            return true;
        }

        function resetUI() {
            videoWrapper.classList.remove('show');
            videoInfo.classList.remove('show');
            actions.classList.remove('show');
            videoPlayer.src = '';
            currentVideoUrl = null;
            currentVideoData = null;
        }

        // ============================================================
        //  Gọi API TikTok (dùng TikWM)
        // ============================================================
        async function fetchTikTok(url) {
            // Chuẩn hóa URL
            let cleanUrl = url.trim();
            if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
                cleanUrl = 'https://' + cleanUrl;
            }

            // Kiểm tra định dạng TikTok
            const tiktokPattern = /(tiktok\.com|vm\.tiktok\.com|vt\.tiktok\.com)/i;
            if (!tiktokPattern.test(cleanUrl)) {
                setStatus('⚠️ Vui lòng nhập link TikTok hợp lệ.', 'error');
                return;
            }

            setLoading(true);
            setStatus('⏳ Đang lấy thông tin video...', '');

            try {
                // Dùng TikWM API (hỗ trợ CORS, miễn phí)
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(cleanUrl)}`;

                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    },
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();

                if (result.code !== 0 || !result.data) {
                    // Thử fallback với api khác
                    throw new Error(result.msg || 'Không tìm thấy video.');
                }

                const data = result.data;

                // Kiểm tra có video không
                const videoUrl = data.play || data.wmplay || data.hdplay;
                if (!videoUrl) {
                    throw new Error('Video không có sẵn (có thể bị private hoặc xóa).');
                }

                showVideo(data);

            } catch (err) {
                console.error('Lỗi:', err);
                setStatus(`❌ Lỗi: ${err.message || 'Không thể tải video. Thử lại sau.'}`, 'error');
                resetUI();
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        //  Tải video (download)
        // ============================================================
        async function downloadVideo() {
            if (!currentVideoUrl) {
                setStatus('⚠️ Không có video để tải.', 'error');
                return;
            }

            try {
                downloadBtn.disabled = true;
                downloadBtn.textContent = '⏳ Đang tải...';
                setStatus('⏳ Đang tải xuống video...', '');

                // Lấy tên file từ title
                let filename = 'video_tiktok.mp4';
                if (currentVideoData?.title) {
                    const safe = currentVideoData.title.replace(/[^a-zA-Z0-9 ]/g, '').trim().slice(0, 40);
                    if (safe) filename = `${safe}.mp4`;
                }

                // Fetch video dạng blob
                const response = await fetch(currentVideoUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                // Tạo link tải
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Giải phóng URL sau 1s
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

                setStatus('✅ Tải xuống hoàn tất!', 'success');

            } catch (err) {
                console.error('Lỗi tải:', err);
                setStatus(`❌ Không thể tải video: ${err.message}`, 'error');
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.textContent = '⬇️ Tải video (không logo)';
            }
        }

        // ============================================================
        //  Sao chép link
        // ============================================================
        function copyLink() {
            const link = urlInput.value.trim();
            if (!link) {
                setStatus('⚠️ Không có link để sao chép.', 'error');
                return;
            }
            navigator.clipboard.writeText(link)
                .then(() => setStatus('✅ Đã sao chép link vào clipboard!', 'success'))
                .catch(() => {
                    // Fallback
                    urlInput.select();
                    document.execCommand('copy');
                    setStatus('✅ Đã sao chép link!', 'success');
                });
        }

        // ============================================================
        //  Sự kiện
        // ============================================================

        // Nút Lấy video
        fetchBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (!url) {
                setStatus('⚠️ Vui lòng nhập link TikTok.', 'error');
                return;
            }
            resetUI();
            fetchTikTok(url);
        });

        // Enter
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                fetchBtn.click();
            }
        });

        // Nút Tải
        downloadBtn.addEventListener('click', downloadVideo);

        // Nút Sao chép
        copyBtn.addEventListener('click', copyLink);

        // ============================================================
        //  Tự động detect link từ clipboard (optional)
        // ============================================================
        // Khi focus vào input, thử lấy link từ clipboard
        urlInput.addEventListener('focus', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text && text.includes('tiktok.com')) {
                    urlInput.value = text.trim();
                    setStatus('📋 Đã dán link từ clipboard. Nhấn "Lấy video"', '');
                }
            } catch (_) { /* bỏ qua nếu không có quyền */ }
        });

        // ============================================================
        //  Xử lý paste trực tiếp
        // ============================================================
        urlInput.addEventListener('paste', () => {
            // Sau khi paste, đợi 100ms để giá trị cập nhật
            setTimeout(() => {
                const val = urlInput.value.trim();
                if (val && val.includes('tiktok.com')) {
                    setStatus('✅ Link đã được dán. Nhấn "Lấy video" để tải.', 'success');
                }
            }, 100);
        });

        // ============================================================
        //  Khởi tạo
        // ============================================================
        setStatus('🎯 Nhập link TikTok và nhấn "Lấy video"', '');
        console.log('🎵 TikTok Downloader ready — không logo, miễn phí.');
    </script>

</body>
  </html>
