<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Scan Nhan Sắc 4.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h2 { color: #38bdf8; margin-bottom: 15px; font-size: 22px; }
    .camera-box {
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      border: 2px dashed #38bdf8;
    }
    #scanner-line {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      animation: scan 1.5s infinite linear;
    }
    @keyframes scan {
      0% { top: 0; }
      50% { top: 96%; }
      100% { top: 0; }
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }
    .btn-main { background: #38bdf8; color: #0f172a; width: 100%; }
    .btn-main:hover { background: #0ea5e9; }
    #status { margin-top: 12px; font-size: 14px; color: #94a3b8; }
    #result-area { display: none; margin-top: 15px; }
    .score { font-size: 32px; color: #ef4444; font-weight: bold; margin: 10px 0; }
    .btn-dodge {
      position: absolute;
      background: #ef4444;
      color: white;
      transition: 0.1s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>✨ MÁY QUÉT NHAN SẮC AI ✨</h2>
    
    <div class="camera-box">
      <span id="cam-placeholder" style="color: #64748b; font-size: 14px;">Chưa mở camera</span>
      <div id="scanner-line"></div>
    </div>

    <button id="scan-btn" class="btn-main" onclick="startScan()">BẮT ĐẦU QUÉT KHUÔN MẶT</button>
    <div id="status"></div>

    <div id="result-area">
      <p style="color: #cbd5e1;">Kết quả phân tích độ đẹp trai/xinh gái:</p>
      <div class="score">-999 / 100 Điểm</div>
      <p style="color: #facc15; font-size: 14px; margin-bottom: 15px;">Đánh giá AI: Khuôn mặt có tính sát thương cực cao cho người nhìn!</p>
      
      <button class="btn-dodge" id="dodgeBtn" onmouseover="dodge()" onclick="dodge()">Không phục? Quét lại!</button>
    </div>
  </div>

  <script>
    function startScan() {
      const btn = document.getElementById('scan-btn');
      const status = document.getElementById('status');
      const scanner = document.getElementById('scanner-line');
      const placeholder = document.getElementById('cam-placeholder');
      
      btn.style.display = 'none';
      placeholder.innerText = 'Đang nhận diện ngũ quan...';
      scanner.style.display = 'block';

      const logs = [
        'Đang đo tỉ lệ vàng gương mặt...',
        'Phát hiện dung nhan lạ...',
        'Hệ thống AI đang quá tải vì độ ảo...',
        'Hoàn tất phân tích!'
      ];

      let step = 0;
      const timer = setInterval(() => {
        if (step < logs.length) {
          status.innerText = logs[step];
          step++;
        } else {
          clearInterval(timer);
          scanner.style.display = 'none';
          placeholder.innerText = 'Quét xong!';
          status.style.display = 'none';
          document.getElementById('result-area').style.display = 'block';
        }
      }, 900);
    }

    function dodge() {
      const btn = document.getElementById('dodgeBtn');
      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 50);
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }
  </script>
</body>
</html>
