<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Downloader - Web chính</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b1a;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1a3e 0%, #0b0b1a 70%);
            padding: 20px;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 40px 32px 48px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(255, 0, 80, 0.3);
        }
        .header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
        }
        .header h1 span {
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
        }
        .btn-logout {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff0050, #d4006e);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .btn-success {
            background: linear-gradient(135deg, #00c851, #00e676);
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-admin {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: none;
            box-shadow: 0 4px 16px rgba(245, 87, 108, 0.4);
        }
        .btn-admin:hover {
            transform: scale(1.05);
        }
        .btn-inbox {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
        }
        .btn-inbox .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff0050;
            color: #fff;
            border-radius: 50%;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 700;
            display: none;
        }
        .btn-inbox:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .auth-container {
            display: block;
        }
        .auth-container.hidden {
            display: none;
        }
        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 6px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .auth-form.active {
            display: flex;
        }
        .auth-form input {
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .auth-form input:focus {
            border-color: rgba(255, 0, 80, 0.5);
        }
        .auth-form .btn-primary {
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
        }
        .auth-error {
            color: #ff6b6b;
            font-size: 14px;
            min-height: 20px;
        }
        .auth-success {
            color: #69db7c;
            font-size: 14px;
            min-height: 20px;
        }

        .main-content {
            display: none;
            animation: fadeUp 0.5s ease;
        }
        .main-content.show {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .input-group input {
            flex: 1;
            min-width: 200px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .input-group input:focus {
            border-color: rgba(255, 0, 80, 0.5);
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .status {
            min-height: 28px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        .status .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ff0050;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .status.loading .spinner {
            display: inline-block;
        }
        .status.error {
            color: #ff6b6b;
        }
        .status.success {
            color: #69db7c;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .video-wrapper {
            display: none;
            margin-top: 8px;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
        }
        .video-wrapper.show {
            display: block;
            animation: fadeUp 0.5s ease;
        }
        .video-wrapper video {
            width: 100%;
            display: block;
            aspect-ratio: 9 / 16;
            background: #000;
            object-fit: contain;
        }
        .video-info {
            display: none;
            padding: 20px 0 8px;
            color: #fff;
        }
        .video-info.show {
            display: block;
        }
        .video-info .title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .video-info .author {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }
        .video-info .author::before {
            content: '@';
            opacity: 0.6;
        }
        .actions {
            display: none;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .actions.show {
            display: flex;
        }
        .actions .btn {
            flex: 1;
            min-width: 140px;
        }

        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .footer p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
        }
        .footer .badge {
            display: flex;
            gap: 6px;
        }
        .footer .badge span {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        .cloud-status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online {
            background: #4caf50;
        }
        .dot.offline {
            background: #ff5252;
        }
        .dot.syncing {
            background: #ffc107;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* Inbox Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1e1e2f;
            border-radius: 32px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            padding: 28px 24px;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .modal h2 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 28px;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #fff;
        }
        .message-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 3px solid transparent;
        }
        .message-item.unread {
            border-left-color: #ff0050;
            background: rgba(255, 0, 80, 0.06);
        }
        .message-item .msg-header {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 4px;
        }
        .message-item .msg-content {
            color: #fff;
        }
        .message-item .msg-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 18px 32px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: flex-end;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="header-left">
                <div class="logo-icon">🎵</div>
                <div>
                    <h1>TikTok <span>Downloader</span></h1>
                    <p style="color: rgba(255, 255, 255, 0.5); font-size: 14px;">Web chính – Đồng bộ qua JSONBin</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="cloud-status" id="cloudStatus">
                    <span class="dot offline" id="cloudDot"></span>
                    <span id="cloudStatusText">Đang kết nối...</span>
                </span>
                <button id="inboxBtn" class="btn btn-inbox" style="display:none;">
                    📩 Hộp thư <span class="badge" id="inboxBadge">0</span>
                </button>
                <a href="https://ruanxue432-hash.github.io/cocai.chim.github.io/" target="_blank" id="adminLinkBtn" class="btn btn-admin">⚙️ Quản trị</a>
                <button id="logoutBtn" class="btn btn-logout" style="display:none;">🚪 Đăng xuất</button>
            </div>
        </div>

        <!-- Auth -->
        <div id="authContainer" class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Đăng nhập</button>
                <button class="auth-tab" data-tab="register">Đăng ký</button>
            </div>
            <form id="loginForm" class="auth-form active">
                <input type="text" id="loginUsername" placeholder="Tên đăng nhập" />
                <input type="password" id="loginPassword" placeholder="Mật khẩu" />
                <div id="loginError" class="auth-error"></div>
                <button type="submit" class="btn btn-primary">🔑 Đăng nhập</button>
            </form>
            <form id="registerForm" class="auth-form">
                <input type="text" id="regUsername" placeholder="Chọn tên" />
                <input type="password" id="regPassword" placeholder="Mật khẩu (>=4 ký tự)" />
                <input type="password" id="regConfirm" placeholder="Xác nhận mật khẩu" />
                <div id="regError" class="auth-error"></div>
                <div id="regSuccess" class="auth-success"></div>
                <button type="submit" class="btn btn-primary">📝 Đăng ký</button>
            </form>
        </div>

        <!-- Main -->
        <div id="mainContent" class="main-content">
            <div class="input-group">
                <input id="urlInput" type="url" placeholder="https://www.tiktok.com/@user/video/..." />
                <button id="fetchBtn" class="btn btn-primary">🔍 Lấy video</button>
            </div>
            <div id="status" class="status">
                <span class="spinner"></span>
                <span id="statusText">Nhập link TikTok và nhấn "Lấy video"</span>
            </div>
            <div id="videoWrapper" class="video-wrapper">
                <video id="videoPlayer" controls preload="metadata" playsinline></video>
            </div>
            <div id="videoInfo" class="video-info">
                <div class="title" id="videoTitle"></div>
                <div class="author" id="videoAuthor"></div>
            </div>
            <div id="actions" class="actions">
                <button id="downloadBtn" class="btn btn-success">⬇️ Tải video (không logo)</button>
                <button id="copyBtn" class="btn btn-outline">📋 Sao chép link</button>
            </div>
            <div class="footer">
                <p>⚡ Tải video TikTok chất lượng HD</p>
                <div class="badge"><span>miễn phí</span><span>không logo</span></div>
            </div>
        </div>
    </div>

    <!-- Inbox Modal -->
    <div class="modal-overlay" id="inboxModal">
        <div class="modal">
            <h2>
                <span>📩 Hộp thư đến</span>
                <button class="modal-close" id="closeInbox">&times;</button>
            </h2>
            <div id="inboxList"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        //  CẤU HÌNH JSONBIN (THAY BẰNG ID VÀ KEY CỦA BẠN)
        // ============================================================
        const BIN_ID = '6a8d5715f5f4af5e293f7ca4'; // ← Bin ID của bạn
        const API_KEY = ' $2a$10$pEiPqLci6pwUrHYgPldafuDA0NrT8hmsAM7UxxqkiwX0nAtXmY4M2'; // ← Dán API Key vào đây
        
        // ============================================================

        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const HEADERS = {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
        };

        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin123';

        // ============================================================
        //  QUẢN LÝ DỮ LIỆU
        // ============================================================

        const STORAGE_KEY = 'tiktok_users';
        const SESSION_KEY = 'tiktok_session';

        function getUsers() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {};
        }

        function saveUsers(users) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        }

        function getSession() {
            const data = localStorage.getItem(SESSION_KEY);
            return data ? JSON.parse(data) : null;
        }

        function setSession(session) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        // ---- JSONBin API ----
        let cachedRecord = null;

        async function fetchBin() {
            try {
                const res = await fetch(JSONBIN_URL, { headers: HEADERS });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(`HTTP ${res.status}: ${errData.message || res.statusText}`);
                }
                const data = await res.json();
                cachedRecord = data.record;
                if (!cachedRecord.messages) cachedRecord.messages = [];
                if (!cachedRecord.users) cachedRecord.users = {};
                return cachedRecord;
            } catch (err) {
                console.error('Lỗi đọc JSONBin:', err);
                throw err;
            }
        }

        async function updateBin(content) {
            try {
                const res = await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: HEADERS,
                    body: JSON.stringify(content)
                });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(`HTTP ${res.status}: ${errData.message || res.statusText}`);
                }
                cachedRecord = content;
                return true;
            } catch (err) {
                console.error('Lỗi ghi JSONBin:', err);
                throw err;
            }
        }

        // ---- Đồng bộ lên cloud ----
        async function syncToBin() {
            const users = getUsers();
            if (!users[ADMIN_USERNAME]) {
                users[ADMIN_USERNAME] = { password: ADMIN_PASSWORD, role: 'admin' };
            } else {
                users[ADMIN_USERNAME].role = 'admin';
            }
            const current = cachedRecord || (await fetchBin());
            const payload = {
                users: users,
                messages: current.messages || [],
                lastUpdated: Date.now()
            };
            await updateBin(payload);
            updateCloudStatus('online', 'Đã đồng bộ ' + new Date().toLocaleTimeString());
            showToast('☁️ Đã đồng bộ lên JSONBin');
            return true;
        }

        // ---- Hàm lấy tin nhắn ----
        function getMessages(record) {
            return record.messages || [];
        }

        // ---- Đánh dấu đã đọc ----
        async function markAsRead(msgId) {
            const record = await fetchBin();
            const msg = record.messages.find(m => m.id === msgId);
            if (msg) {
                msg.status = 'read';
                await updateBin(record);
                return true;
            }
            return false;
        }

        // ---- Chấp nhận lời mời ----
        async function acceptInvite(fromUser) {
            try {
                const record = await fetchBin();
                const users = getUsers();
                if (!users[fromUser]) return showToast('Không tìm thấy user', true);
                users[fromUser].role = 'admin';
                saveUsers(users);
                // Đánh dấu tất cả thư mời từ user này là đã đọc
                for (const msg of record.messages) {
                    if (msg.from === fromUser && msg.type === 'invite_admin' && msg.to === getSession().username) {
                        msg.status = 'read';
                    }
                }
                await updateBin(record);
                updateAdminButton();
                renderInboxModal();
                showToast(`✅ Bạn đã trở thành admin!`);
                // Reload để cập nhật UI
                location.reload();
            } catch (err) {
                showToast('❌ Lỗi: ' + err.message, true);
            }
        }

        // ============================================================
        //  POLLING
        // ============================================================

        let pollingInterval = null;

        async function pollBin() {
            try {
                const cloud = await fetchBin();
                if (!cloud || !cloud.users) {
                    updateCloudStatus('offline', 'Dữ liệu JSONBin không hợp lệ');
                    return;
                }
                // Kiểm tra xem user hiện tại còn tồn tại không
                const session = getSession();
                if (session && !cloud.users[session.username]) {
                    clearSession();
                    location.reload();
                    return;
                }
                // Cập nhật role local nếu thay đổi
                if (session) {
                    const localUser = getUsers()[session.username];
                    const cloudUser = cloud.users[session.username];
                    if (cloudUser && localUser && localUser.role !== cloudUser.role) {
                        const users = getUsers();
                        users[session.username].role = cloudUser.role;
                        saveUsers(users);
                        updateAdminButton();
                        showToast('🔄 Role của bạn đã được cập nhật');
                    }
                }
                updateCloudStatus('online', 'Đã cập nhật ' + new Date(cloud.lastUpdated).toLocaleTimeString());
                // Cập nhật badge hộp thư
                updateInboxBadge(cloud);
            } catch (err) {
                updateCloudStatus('offline', 'Lỗi: ' + err.message);
            }
        }

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollBin();
            pollingInterval = setInterval(pollBin, 5000);
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        // ============================================================
        //  UI HELPERS
        // ============================================================

        function showToast(msg, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.background = isError ? 'rgba(200, 50, 50, 0.9)' : 'rgba(0, 0, 0, 0.85)';
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
        }

        function updateCloudStatus(status, msg) {
            const dot = document.getElementById('cloudDot');
            const text = document.getElementById('cloudStatusText');
            dot.className = 'dot ' + status;
            text.textContent = msg;
        }

        function setStatus(msg, type = '') {
            const el = document.getElementById('statusText');
            const parent = document.getElementById('status');
            el.textContent = msg;
            parent.className = 'status';
            if (type) parent.classList.add(type);
        }

        function setLoading(loading) {
            const btn = document.getElementById('fetchBtn');
            btn.disabled = loading;
            btn.textContent = loading ? '⏳ Đang xử lý...' : '🔍 Lấy video';
            const parent = document.getElementById('status');
            if (loading) parent.classList.add('loading');
            else parent.classList.remove('loading');
        }

        function resetUI() {
            document.getElementById('videoWrapper').classList.remove('show');
            document.getElementById('videoInfo').classList.remove('show');
            document.getElementById('actions').classList.remove('show');
            document.getElementById('videoPlayer').src = '';
            currentVideoUrl = null;
        }

        function updateAdminButton() {
            const session = getSession();
            const btn = document.getElementById('adminLinkBtn');
            if (session && session.role === 'admin') {
                btn.style.display = 'inline-flex';
            } else {
                btn.style.display = 'none';
            }
        }

        function updateInboxBadge(record) {
            const session = getSession();
            if (!session) return;
            const messages = getMessages(record);
            const unread = messages.filter(m => m.to === session.username && m.status === 'unread');
            const badge = document.getElementById('inboxBadge');
            const btn = document.getElementById('inboxBtn');
            if (unread.length > 0) {
                badge.textContent = unread.length;
                badge.style.display = 'inline';
                btn.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
                // Vẫn hiện nút nếu có thư (đã đọc)
                const total = messages.filter(m => m.to === session.username);
                if (total.length > 0) {
                    btn.style.display = 'inline-flex';
                } else {
                    btn.style.display = 'none';
                }
            }
        }

        // ============================================================
        //  INBOX MODAL
        // ============================================================

        async function renderInboxModal() {
            const session = getSession();
            if (!session) return;
            const record = await fetchBin();
            const messages = getMessages(record);
            const inbox = messages.filter(m => m.to === session.username);
            const container = document.getElementById('inboxList');
            if (inbox.length === 0) {
                container.innerHTML = '<p style="color:rgba(255,255,255,0.3);">📭 Hộp thư trống</p>';
                return;
            }
            container.innerHTML = inbox.sort((a, b) => b.timestamp - a.timestamp).map(msg => {
                const isUnread = msg.status === 'unread';
                const isInvite = msg.type === 'invite_admin';
                const date = new Date(msg.timestamp).toLocaleString();
                return `
                    <div class="message-item ${isUnread ? 'unread' : ''}">
                        <div class="msg-header">
                            <span>Từ: <strong>${msg.from}</strong></span>
                            <span>${date}</span>
                        </div>
                        <div class="msg-content">${msg.content}</div>
                        <div class="msg-actions">
                            ${isUnread ? `<button class="btn btn-outline btn-sm" onclick="markReadFromModal('${msg.id}')">Đánh dấu đã đọc</button>` : ''}
                            ${isInvite && isUnread ? `<button class="btn btn-success btn-sm" onclick="acceptInvite('${msg.from}')">✅ Chấp nhận làm admin</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.markReadFromModal = async function(msgId) {
            try {
                await markAsRead(msgId);
                showToast('✅ Đã đánh dấu đã đọc');
                const record = await fetchBin();
                updateInboxBadge(record);
                renderInboxModal();
            } catch (err) {
                showToast('❌ Lỗi: ' + err.message, true);
            }
        };

        // ============================================================
        //  AUTH
        // ============================================================

        function registerUser(username, password, confirm) {
            if (password !== confirm) return { ok: false, msg: 'Mật khẩu không khớp.' };
            if (password.length < 4) return { ok: false, msg: 'Mật khẩu >= 4 ký tự.' };
            if (username === ADMIN_USERNAME) return { ok: false, msg: 'Tên không được phép.' };
            const users = getUsers();
            if (users[username]) return { ok: false, msg: 'Tên đã tồn tại.' };
            users[username] = { password, role: 'user' };
            saveUsers(users);
            syncToBin();
            return { ok: true, msg: 'Đăng ký thành công!' };
        }

        function loginUser(username, password) {
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                setSession({ username, role: 'admin' });
                return { ok: true, role: 'admin' };
            }
            const users = getUsers();
            const user = users[username];
            if (!user || user.password !== password) {
                return { ok: false, msg: 'Sai tên hoặc mật khẩu.' };
            }
            setSession({ username, role: user.role || 'user' });
            return { ok: true, role: user.role || 'user' };
        }

        function logoutUser() {
            clearSession();
            location.reload();
        }

        // ============================================================
        //  VIDEO TIKTOK
        // ============================================================

        let currentVideoUrl = null;
        let currentVideoData = null;

        async function fetchTikTok(url) {
            let cleanUrl = url.trim();
            if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) cleanUrl = 'https://' + cleanUrl;
            setLoading(true);
            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(cleanUrl)}`);
                if (!response.ok) throw new Error('Lỗi kết nối API');
                const data = await response.json();
                if (data.code !== 0 || !data.data) throw new Error(data.msg || 'Không tìm thấy video');
                const videoData = data.data;
                const videoUrl = videoData.play || videoData.wmplay || videoData.hdplay;
                if (!videoUrl) throw new Error('Không có link video');
                currentVideoUrl = videoUrl;
                currentVideoData = videoData;
                const player = document.getElementById('videoPlayer');
                player.src = videoUrl;
                player.load();
                document.getElementById('videoWrapper').classList.add('show');
                document.getElementById('videoTitle').textContent = videoData.title || 'Video TikTok';
                document.getElementById('videoAuthor').textContent = videoData.author?.unique_id || 'unknown';
                document.getElementById('videoInfo').classList.add('show');
                document.getElementById('actions').classList.add('show');
                setStatus('✅ Đã tải video thành công!', 'success');
            } catch (err) {
                setStatus('❌ ' + err.message, 'error');
                resetUI();
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        //  DOM EVENTS
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {

            // ---- Kiểm tra đăng nhập ----
            const session = getSession();
            if (session) {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('mainContent').classList.add('show');
                document.getElementById('logoutBtn').style.display = 'inline-flex';
                document.getElementById('inboxBtn').style.display = 'inline-flex';
                updateAdminButton();
                setStatus('👋 Chào ' + session.username + '! Nhập link TikTok để tải.');
                startPolling();
                setTimeout(() => pollBin(), 1000);
            } else {
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('mainContent').classList.remove('show');
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('adminLinkBtn').style.display = 'none';
                document.getElementById('inboxBtn').style.display = 'none';
                setStatus('🔐 Vui lòng đăng nhập để sử dụng.');
            }

            // ---- Auth tabs ----
            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                    document.getElementById(target + 'Form').classList.add('active');
                    document.getElementById('loginError').textContent = '';
                    document.getElementById('regError').textContent = '';
                    document.getElementById('regSuccess').textContent = '';
                });
            });

            // ---- Đăng nhập ----
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                const errorEl = document.getElementById('loginError');
                if (!username || !password) {
                    errorEl.textContent = 'Vui lòng nhập đầy đủ.';
                    return;
                }
                const result = loginUser(username, password);
                if (result.ok) {
                    errorEl.textContent = '';
                    location.reload();
                } else {
                    errorEl.textContent = result.msg;
                }
            });

            // ---- Đăng ký ----
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('regUsername').value.trim();
                const password = document.getElementById('regPassword').value.trim();
                const confirm = document.getElementById('regConfirm').value.trim();
                const errorEl = document.getElementById('regError');
                const successEl = document.getElementById('regSuccess');
                const result = registerUser(username, password, confirm);
                if (result.ok) {
                    successEl.textContent = result.msg;
                    errorEl.textContent = '';
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regPassword').value = '';
                    document.getElementById('regConfirm').value = '';
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('loginUsername').value = username;
                    document.getElementById('loginPassword').value = '';
                    document.getElementById('loginError').textContent = '';
                } else {
                    errorEl.textContent = result.msg;
                    successEl.textContent = '';
                }
            });

            // ---- Đăng xuất ----
            document.getElementById('logoutBtn').addEventListener('click', logoutUser);

            // ---- Inbox ----
            document.getElementById('inboxBtn').addEventListener('click', async () => {
                document.getElementById('inboxModal').classList.add('active');
                await renderInboxModal();
            });
            document.getElementById('closeInbox').addEventListener('click', () => {
                document.getElementById('inboxModal').classList.remove('active');
            });
            document.getElementById('inboxModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    document.getElementById('inboxModal').classList.remove('active');
                }
            });

            // ---- Lấy video ----
            document.getElementById('fetchBtn').addEventListener('click', () => {
                const url = document.getElementById('urlInput').value.trim();
                if (!url) {
                    setStatus('⚠️ Vui lòng nhập link TikTok.', 'error');
                    return;
                }
                resetUI();
                fetchTikTok(url);
            });

            document.getElementById('urlInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('fetchBtn').click();
            });

            // ---- Tải video ----
            document.getElementById('downloadBtn').addEventListener('click', async () => {
                if (!currentVideoUrl) {
                    setStatus('⚠️ Không có video để tải.', 'error');
                    return;
                }
                const btn = document.getElementById('downloadBtn');
                try {
                    btn.disabled = true;
                    btn.textContent = '⏳ Đang tải...';
                    setStatus('⏳ Đang tải xuống...', '');
                    const response = await fetch(currentVideoUrl);
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = 'tiktok_video.mp4';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                    setStatus('✅ Tải xuống hoàn tất!', 'success');
                } catch (err) {
                    setStatus('❌ Tải thất bại: ' + err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = '⬇️ Tải video (không logo)';
                }
            });

            // ---- Sao chép link ----
            document.getElementById('copyBtn').addEventListener('click', () => {
                const link = document.getElementById('urlInput').value.trim();
                if (!link) {
                    setStatus('⚠️ Không có link để sao chép.', 'error');
                    return;
                }
                navigator.clipboard.writeText(link)
                    .then(() => setStatus('✅ Đã sao chép link!', 'success'))
                    .catch(() => {
                        document.getElementById('urlInput').select();
                        document.execCommand('copy');
                        setStatus('✅ Đã sao chép link!', 'success');
                    });
            });

            // ---- Cấu hình JSONBin ----
            if (BIN_ID === '6a8d548f23a2f6593e5a08d9' || API_KEY === '$2a$10$pEiPqLci6pwUrHYgPldafuDA0NrT8hmsAM7UxxqkiwX0nAtXmY4M2') {
                showToast('⚠️ Vui lòng cấu hình BIN_ID và API_KEY trong code', true);
                updateCloudStatus('offline', 'Chưa cấu hình JSONBin');
            } else {
                updateCloudStatus('online', 'Sẵn sàng');
            }
        });
    </script>
</body>
