<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Python IDE Mobile</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#090d16',
                            card: '#111827',
                            border: '#1f2937',
                            neon: '#00f0ff',
                            pink: '#ff0055',
                            accent: '#10b981'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Three.js Library & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Pyodide Python Engine (WASM) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Prevent zooming on iOS double tap */
        textarea {
            font-size: 14px !important;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden text-gray-200">

    <!-- TOP HALF: ALWAYS VISIBLE 3D VIEWPORT (45% Height) -->
    <div id="viewport-wrapper" class="relative w-full h-[45%] bg-black border-b-2 border-cyber-neon/40 shadow-lg">
        <!-- Canvas Mounting Point -->
        <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

        <!-- Floating Controls Badge -->
        <div class="absolute top-2 left-2 z-10 flex items-center gap-2 bg-cyber-card/80 backdrop-blur-md px-2.5 py-1 rounded-full border border-gray-700 text-[11px]">
            <span class="w-2 h-2 rounded-full bg-cyber-neon animate-pulse"></span>
            <span class="font-mono text-cyber-neon font-bold">3D VIEWPORT</span>
        </div>

        <!-- 3D Scene Action Quick Buttons -->
        <div class="absolute top-2 right-2 z-10 flex items-center gap-1.5">
            <button onclick="resetCamera()" class="bg-cyber-card/80 hover:bg-gray-800 text-xs text-gray-300 p-2 rounded-lg border border-gray-700 shadow" title="Reset View">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <button onclick="clear3DScene()" class="bg-cyber-card/80 hover:bg-red-950 text-xs text-red-400 p-2 rounded-lg border border-red-800/50 shadow" title="Clear Scene">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <!-- Swipe Helper Hint -->
        <div class="absolute bottom-1 left-2 z-10 text-[10px] text-gray-400 bg-black/60 px-2 py-0.5 rounded pointer-events-none">
            <i class="fa-solid fa-hand-pointer mr-1 text-cyber-neon"></i> Drag to rotate / Pinch to zoom
        </div>
    </div>

    <!-- BOTTOM HALF: EDITOR & TERMINAL (55% Height) -->
    <div class="flex-1 flex flex-col w-full bg-cyber-bg overflow-hidden">
        
        <!-- Controls Bar -->
        <div class="h-12 bg-cyber-card border-b border-gray-800 px-3 flex items-center justify-between z-10">
            <!-- Pyodide Engine Load Status -->
            <div id="status-indicator" class="flex items-center gap-2 text-xs font-mono text-amber-400 bg-black/40 px-2.5 py-1 rounded-lg border border-gray-800">
                <i class="fa-solid fa-circle-notch fa-spin text-amber-400" id="status-icon"></i>
                <span id="status-text">Loading Python...</span>
            </div>

            <!-- Preset Samples Dropdown -->
            <select id="preset-select" onchange="loadPreset(this.value)" class="bg-gray-900 border border-gray-700 text-xs text-cyber-neon rounded-lg px-2 py-1.5 focus:outline-none">
                <option value="matrix">Preset: Cube Grid</option>
                <option value="ring">Preset: Saturn Rings</option>
                <option value="wave">Preset: 3D Wave Grid</option>
            </select>

            <!-- Prominent RUN Button -->
            <button id="run-btn" disabled onclick="runPythonCode()" class="bg-gradient-to-r from-emerald-500 to-cyber-accent text-gray-950 font-bold px-4 py-1.5 rounded-lg text-xs flex items-center gap-1.5 shadow-lg shadow-emerald-900/40 opacity-50 cursor-not-allowed transition active:scale-95">
                <i class="fa-solid fa-play"></i> RUN
            </button>
        </div>

        <!-- Tab Bar -->
        <div class="flex bg-gray-900/80 border-b border-gray-800 text-xs font-mono">
            <button id="tab-code-btn" onclick="switchTab('code')" class="flex-1 py-2 text-center text-cyber-neon border-b-2 border-cyber-neon bg-cyber-card font-bold">
                <i class="fa-solid fa-code mr-1"></i> script.py
            </button>
            <button id="tab-term-btn" onclick="switchTab('terminal')" class="flex-1 py-2 text-center text-gray-400 border-b-2 border-transparent">
                <i class="fa-solid fa-terminal mr-1"></i> Terminal (<span id="term-count">0</span>)
            </button>
        </div>

        <!-- Tab Contents Wrapper -->
        <div class="flex-1 relative overflow-hidden">
            
            <!-- CODE EDITOR TAB -->
            <div id="tab-code" class="absolute inset-0 flex">
                <!-- Line Numbers -->
                <div id="line-numbers" class="w-9 py-2 bg-gray-950 text-right pr-2 text-gray-600 font-mono text-xs select-none border-r border-gray-800 leading-6">
                    1
                </div>
                <!-- Editor Textarea -->
                <textarea id="code-editor" class="flex-1 bg-cyber-bg p-2 text-cyber-neon font-mono text-xs leading-6 resize-none focus:outline-none" spellcheck="false" placeholder="# Type Python code..."></textarea>
            </div>

            <!-- TERMINAL TAB -->
            <div id="tab-terminal" class="absolute inset-0 bg-black p-3 font-mono text-xs overflow-y-auto hidden">
                <div class="flex justify-between items-center border-b border-gray-800 pb-1 mb-2 text-gray-500">
                    <span>Python Stdout Log</span>
                    <button onclick="clearTerminal()" class="text-gray-400 hover:text-white text-[10px]">
                        <i class="fa-solid fa-ban"></i> Clear
                    </button>
                </div>
                <div id="terminal-output" class="space-y-1 text-gray-300">
                    <div class="text-gray-600">// Execution output will be printed here...</div>
                </div>
            </div>

        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- 1. THREE.JS 3D SCENE SETUP ---
        let scene, camera, renderer, controls;
        let createdMeshes = [];
        let defaultCube = null;

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);

            camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;

            // Grid Floor
            const grid = new THREE.GridHelper(20, 20, 0x00f0ff, 0x1f2937);
            grid.position.y = -1;
            scene.add(grid);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xff0055, 2, 20);
            pointLight.position.set(-5, 2, -5);
            scene.add(pointLight);

            // Default Center Shape
            const geo = new THREE.IcosahedronGeometry(1, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, wireframe: true });
            defaultCube = new THREE.Mesh(geo, mat);
            scene.add(defaultCube);

            // Handle Resize
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            if (defaultCube) {
                defaultCube.rotation.x += 0.005;
                defaultCube.rotation.y += 0.01;
            }

            createdMeshes.forEach(mesh => {
                if (mesh.userData && mesh.userData.spin) {
                    mesh.rotation.x += 0.01;
                    mesh.rotation.y += 0.02;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        function resetCamera() {
            camera.position.set(0, 4, 8);
            controls.target.set(0, 0, 0);
        }

        function clear3DScene() {
            createdMeshes.forEach(m => scene.remove(m));
            createdMeshes = [];
            appendTerminal("System: Cleared 3D Scene objects.", "sys");
        }

        // --- 2. PYTHON API BRIDGE (Exposed to Python via Pyodide) ---
        window.py3D = {
            addCube: function(x, y, z, colorHex = '#00f0ff', size = 0.8) {
                const geo = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(colorHex),
                    roughness: 0.3,
                    metalness: 0.8
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.userData.spin = true;
                scene.add(mesh);
                createdMeshes.push(mesh);
                return createdMeshes.length;
            },

            addSphere: function(x, y, z, colorHex = '#ff0055', radius = 0.5) {
                const geo = new THREE.SphereGeometry(radius, 16, 16);
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(colorHex),
                    wireframe: true
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.userData.spin = true;
                scene.add(mesh);
                createdMeshes.push(mesh);
                return createdMeshes.length;
            },

            setCoreColor: function(colorHex) {
                if (defaultCube) {
                    defaultCube.material.color.set(colorHex);
                }
            },

            clearScene: function() {
                clear3DScene();
            }
        };

        // --- 3. PYODIDE WASM ENGINE INITIALIZATION ---
        let pyodide = null;

        async function initPythonEngine() {
            const statusIndicator = document.getElementById('status-indicator');
            const statusIcon = document.getElementById('status-icon');
            const statusText = document.getElementById('status-text');
            const runBtn = document.getElementById('run-btn');

            try {
                pyodide = await loadPyodide();

                // Intercept stdout
                pyodide.setStdout({
                    write: (text) => appendTerminal(text, 'stdout')
                });
                pyodide.setStderr({
                    write: (text) => appendTerminal(text, 'stderr')
                });

                // Define Python API wrapper functions
                await pyodide.runPythonAsync(`
import js

def add_cube(x=0, y=0, z=0, color='#00f0ff', size=0.8):
    return js.py3D.addCube(x, y, z, color, size)

def add_sphere(x=0, y=0, z=0, color='#ff0055', radius=0.5):
    return js.py3D.addSphere(x, y, z, color, radius)

def set_color(color_hex):
    js.py3D.setCoreColor(color_hex)

def clear():
    js.py3D.clearScene()
`);

                // Update Status UI
                statusIndicator.className = "flex items-center gap-1.5 text-xs font-mono text-emerald-400 bg-emerald-950/40 px-2.5 py-1 rounded-lg border border-emerald-800";
                statusIcon.className = "fa-solid fa-check text-emerald-400";
                statusText.innerText = "Python Ready";

                runBtn.disabled = false;
                runBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                appendTerminal("System: Pyodide WASM Python 3.11 ready!", "sys");

            } catch (err) {
                statusIndicator.className = "flex items-center gap-1.5 text-xs font-mono text-red-400 bg-red-950/40 px-2.5 py-1 rounded-lg border border-red-800";
                statusIcon.className = "fa-solid fa-triangle-exclamation text-red-400";
                statusText.innerText = "Pyodide Error";
                appendTerminal("Engine Error: " + err.message, "stderr");
            }
        }

        // --- 4. EDITOR & TERMINAL UI CONTROLS ---
        const editor = document.getElementById('code-editor');
        const lineNums = document.getElementById('line-numbers');
        const terminal = document.getElementById('terminal-output');
        let termLogCount = 0;

        function updateLines() {
            const count = editor.value.split('\n').length;
            lineNums.innerHTML = Array.from({ length: count }, (_, i) => i + 1).join('<br>');
        }
        editor.addEventListener('input', updateLines);

        function appendTerminal(msg, type = 'stdout') {
            if (!msg.trim() && type === 'stdout') return;

            termLogCount++;
            document.getElementById('term-count').innerText = termLogCount;

            const div = document.createElement('div');
            if (type === 'stderr') {
                div.className = "text-red-400 font-mono text-xs";
            } else if (type === 'sys') {
                div.className = "text-cyber-neon font-mono text-xs italic";
            } else {
                div.className = "text-gray-200 font-mono text-xs";
            }

            div.innerText = msg;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearTerminal() {
            terminal.innerHTML = '';
            termLogCount = 0;
            document.getElementById('term-count').innerText = '0';
        }

        async function runPythonCode() {
            if (!pyodide) return;

            const code = editor.value;
            appendTerminal(">>> Executing script...", "sys");

            try {
                await pyodide.runPythonAsync(code);
                appendTerminal("<<< Execution finished.", "sys");
            } catch (err) {
                appendTerminal(err.message, "stderr");
                switchTab('terminal'); // Auto-switch to terminal on error
            }
        }

        function switchTab(tab) {
            const codeTab = document.getElementById('tab-code');
            const termTab = document.getElementById('tab-terminal');
            const codeBtn = document.getElementById('tab-code-btn');
            const termBtn = document.getElementById('tab-term-btn');

            if (tab === 'code') {
                codeTab.classList.remove('hidden');
                termTab.classList.add('hidden');
                codeBtn.className = "flex-1 py-2 text-center text-cyber-neon border-b-2 border-cyber-neon bg-cyber-card font-bold";
                termBtn.className = "flex-1 py-2 text-center text-gray-400 border-b-2 border-transparent";
            } else {
                codeTab.classList.add('hidden');
                termTab.classList.remove('hidden');
                termBtn.className = "flex-1 py-2 text-center text-cyber-neon border-b-2 border-cyber-neon bg-cyber-card font-bold";
                codeBtn.className = "flex-1 py-2 text-center text-gray-400 border-b-2 border-transparent";
            }
        }

        // --- 5. PRESETS ---
        const presets = {
            matrix: `# Python 3D Cube Grid Generator
clear()
set_color("#00f0ff")

print("Spawning 3D Matrix...")
colors = ["#00f0ff", "#ff0055", "#10b981", "#f59e0b"]

count = 0
for x in range(-2, 3, 2):
    for z in range(-2, 3, 2):
        if x == 0 and z == 0: continue
        c = colors[count % len(colors)]
        add_cube(x, 0, z, color=c, size=0.7)
        count += 1

print(f"Created {count} cubes in 3D scene!")`,

            ring: `# Saturn Ring Orbits
import math

clear()
set_color("#ff0055")

print("Building orbital ring...")
num_spheres = 12
radius = 3.5

for i in range(num_spheres):
    angle = (i / num_spheres) * 2 * math.pi
    x = math.cos(angle) * radius
    z = math.sin(angle) * radius
    y = math.sin(i) * 0.8
    add_sphere(x, y, z, color="#00f0ff", radius=0.35)

print("Ring created!")`,

            wave: `# 3D Math Wave Surface
import math

clear()
set_color("#10b981")

print("Generating 3D Wave...")
for x in range(-3, 4):
    for z in range(-3, 4):
        dist = math.sqrt(x**2 + z**2)
        y = math.sin(dist * 1.2) * 0.8
        color = "#00f0ff" if y > 0 else "#ff0055"
        add_cube(x * 0.9, y, z * 0.9, color=color, size=0.4)

print("Wave grid generated!")`
        };

        function loadPreset(key) {
            if (presets[key]) {
                editor.value = presets[key];
                updateLines();
            }
        }

        // --- INITIALIZATION ON LOAD ---
        window.onload = () => {
            init3D();
            animate3D();
            loadPreset('matrix');
            initPythonEngine();
        };
    </script>
</body>
</html>
