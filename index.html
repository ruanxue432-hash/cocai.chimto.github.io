<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sự Kiện Nhận Quà Game Miễn Phí</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    h2 { color: #f59e0b; margin-bottom: 10px; font-size: 20px; }
    p { color: #94a3b8; font-size: 13px; margin-bottom: 15px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    #troll-box {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎁 SỰ KIỆN TẶNG QUÀ VIP</h2>
    <p>Nhập ID tài khoản để nhận 10.000 Kim Cương / 5.000 Robux miễn phí!</p>
    
    <select id="game">
      <option>Free Fire (10.000 KC)</option>
      <option>Roblox (5.000 Robux)</option>
    </select>
    <input type="text" id="userid" placeholder="Nhập ID hoặc Tên tài khoản...">
    <button onclick="startGet()">NHẬN QUÀ NGAY</button>
  </div>

  <div id="troll-box">
    <h1 style="color: #ef4444; font-size: 26px; margin-bottom: 10px;">⚠️ NẠP THẤT BẠI!</h1>
    <p style="color: #fff; font-size: 16px; margin-bottom: 10px;">Hệ thống phát hiện bạn đang có ý định "ăn chùa" quà game!</p>
    <p style="color: #facc15; font-size: 20px; font-weight: bold; margin-bottom: 20px;">🤣 BẠN ĐÃ BỊ TROLL 100%!</p>
    <button onclick="location.reload()" style="background: #38bdf8; color: #000; width: 200px;">Quay lại</button>
  </div>

  <script>
    function startGet() {
      const id = document.getElementById('userid').value.trim();
      if (!id) return alert('Nhập ID vào đã mày ơi!');
      
      document.querySelector('.card').innerHTML = '<h3 style="color:#38bdf8;">Đang kết nối cổng nạp Garena/Roblox...</h3>';
      
      setTimeout(() => {
        document.getElementById('troll-box').style.display = 'flex';
      }, 1500);
    }
  </script>
</body>
</html>
