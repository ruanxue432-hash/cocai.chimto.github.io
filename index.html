<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kéo Nhân Vật</title>
  <style>
    body { margin: 0; background: #0d1117; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    
    /* Khu vực chơi */
    #game-area {
      width: 90vw; height: 80vh;
      background: #161b22;
      border: 2px dashed #30363d;
      border-radius: 15px;
      position: relative;
      touch-action: none; /* Quan trọng: để dùng cảm ứng mượt */
    }

    /* Nhân vật */
    #player {
      width: 60px; height: 60px;
      background: #58a6ff;
      border-radius: 12px;
      position: absolute;
      top: 50%; left: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: grab;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      user-select: none;
    }
    .eye { width: 10px; height: 10px; background: white; border-radius: 50%; margin: 0 5px; }
  </style>
</head>
<body>

  <div id="game-area">
    <div id="player">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const area = document.getElementById('game-area');
    let isDragging = false;

    // Hàm di chuyển (dùng chung cho chuột và tay)
    function moveAt(pageX, pageY) {
      const areaRect = area.getBoundingClientRect();
      
      // Tính vị trí so với khung game
      let newX = pageX - areaRect.left - (player.offsetWidth / 2);
      let newY = pageY - areaRect.top - (player.offsetHeight / 2);

      // Giới hạn không cho nhân vật ra ngoài khung
      const maxX = area.clientWidth - player.offsetWidth;
      const maxY = area.clientHeight - player.offsetHeight;

      newX = Math.max(0, Math.min(newX, maxX));
      newY = Math.max(0, Math.min(newY, maxY));

      player.style.left = newX + 'px';
      player.style.top = newY + 'px';
    }

    // Sự kiện Chuột
    player.addEventListener('mousedown', () => isDragging = true);
    document.addEventListener('mousemove', (e) => {
      if (isDragging) moveAt(e.pageX, e.pageY);
    });
    document.addEventListener('mouseup', () => isDragging = false);

    // Sự kiện Cảm ứng (cho điện thoại)
    player.addEventListener('touchstart', (e) => {
      isDragging = true;
      e.preventDefault(); // Tránh bị cuộn trang khi đang kéo
    });
    document.addEventListener('touchmove', (e) => {
      if (isDragging) {
        moveAt(e.touches[0].pageX, e.touches[0].pageY);
      }
    });
    document.addEventListener('touchend', () => isDragging = false);
  </script>
</body>
</html>
