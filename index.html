<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPy 3D - Interactive Python WebAssembly IDE</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#05070e',
                            panel: '#0d121f',
                            border: '#1e293b',
                            neon: '#00f0ff',
                            pink: '#ff0055',
                            purple: '#7000ff',
                            green: '#00ff66',
                            gold: '#ffb700'
                        }
                    },
                    fontFamily: {
                        mono: ['Fira Code', 'JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Three.js Base & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Pyodide WASM Python Engine -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05070e;
            color: #f3f4f6;
            overflow: hidden;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d121f;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }

        .glow-neon {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        .glow-pink {
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        /* Line Numbers Styling */
        .line-numbers {
            font-family: 'Fira Code', monospace;
            user-select: none;
        }

        .editor-textarea {
            font-family: 'Fira Code', monospace;
            tab-size: 4;
            white-space: pre;
            word-break: normal;
        }

        .glass-panel {
            background: rgba(13, 18, 31, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.15);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative select-none">

    <!-- Header Navbar -->
    <header class="h-14 bg-cyber-panel/90 border-b border-cyber-border px-4 flex items-center justify-between z-20 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-cyber-pink via-cyber-purple to-cyber-neon p-0.5 flex items-center justify-center">
                <div class="w-full h-full bg-cyber-bg rounded-[7px] flex items-center justify-center">
                    <i class="fa-brands fa-python text-cyber-neon text-lg"></i>
                </div>
            </div>
            <div>
                <h1 class="font-black text-base tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyber-neon via-white to-cyber-pink uppercase flex items-center gap-2">
                    CYBER-PY <span class="text-[10px] px-2 py-0.5 rounded bg-cyber-neon/10 text-cyber-neon border border-cyber-neon/30">3D WASM</span>
                </h1>
            </div>
        </div>

        <!-- Pyodide Engine Status Indicator -->
        <div class="flex items-center gap-3">
            <div id="pyodide-status" class="flex items-center gap-2 text-xs bg-cyber-bg/80 border border-cyber-border px-3 py-1.5 rounded-full text-gray-400">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
                <span id="status-text">Loading Python Engine...</span>
            </div>

            <button id="toggle-editor-btn" class="sm:hidden text-cyber-neon p-2 bg-cyber-bg rounded border border-cyber-border">
                <i class="fa-solid fa-code"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex-1 relative flex overflow-hidden">
        
        <!-- 3D Canvas Background -->
        <div id="canvas-container" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

        <!-- Floating Quick Preset Controls overlay top-left -->
        <div class="absolute top-4 left-4 z-10 flex flex-wrap gap-2 pointer-events-auto max-w-[calc(100%-20px)] sm:max-w-md">
            <button onclick="loadExample('matrix')" class="px-3 py-1.5 rounded-lg glass-panel text-xs text-cyber-neon border border-cyber-neon/30 hover:bg-cyber-neon/20 transition flex items-center gap-1.5">
                <i class="fa-solid fa-cubes"></i> Cube Matrix
            </button>
            <button onclick="loadExample('rainbow')" class="px-3 py-1.5 rounded-lg glass-panel text-xs text-cyber-pink border border-cyber-pink/30 hover:bg-cyber-pink/20 transition flex items-center gap-1.5">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Rainbow Orbit
            </button>
            <button onclick="loadExample('wave')" class="px-3 py-1.5 rounded-lg glass-panel text-xs text-cyber-gold border border-cyber-gold/30 hover:bg-cyber-gold/20 transition flex items-center gap-1.5">
                <i class="fa-solid fa-wave-square"></i> Wave Mesh
            </button>
        </div>

        <!-- Floating Sidebar Code Editor & Terminal Panel -->
        <aside id="editor-panel" class="absolute top-0 right-0 h-full w-full sm:w-[500px] md:w-[580px] glass-panel border-l border-cyber-border z-10 flex flex-col transition-transform duration-300">
            
            <!-- Editor Toolbar -->
            <div class="h-11 bg-cyber-panel/90 border-b border-cyber-border px-4 flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-mono text-gray-300">
                    <i class="fa-solid fa-code text-cyber-neon"></i>
                    <span>script.py</span>
                </div>

                <div class="flex items-center gap-2">
                    <button id="clear-scene-btn" class="px-2.5 py-1 text-xs rounded bg-cyber-bg border border-cyber-border text-gray-400 hover:text-white hover:border-gray-500 transition" title="Clear 3D Scene">
                        <i class="fa-solid fa-trash-can"></i> Clear 3D
                    </button>
                    
                    <button id="run-btn" disabled class="px-4 py-1 text-xs font-bold rounded bg-cyber-neon text-cyber-bg hover:bg-cyan-300 transition flex items-center gap-1.5 glow-neon disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-play"></i> RUN SCRIPT
                    </button>
                </div>
            </div>

            <!-- Code Editor Area -->
            <div class="flex-1 flex relative overflow-hidden bg-cyber-bg/90 font-mono text-sm">
                <!-- Line Numbers -->
                <div id="line-numbers" class="w-12 py-3 px-1 text-right text-gray-600 bg-cyber-panel/40 border-r border-cyber-border/40 select-none text-xs leading-6">
                    1
                </div>

                <!-- Textarea Editor -->
                <textarea id="code-editor" class="flex-1 py-3 px-3 bg-transparent text-cyber-neon editor-textarea focus:outline-none resize-none leading-6 text-xs sm:text-sm" spellcheck="false" placeholder="# Write Python code here..."></textarea>
            </div>

            <!-- Console Output Terminal -->
            <div class="h-44 sm:h-52 bg-black/90 border-t border-cyber-border flex flex-col font-mono text-xs">
                <div class="h-8 bg-cyber-panel/80 px-3 border-b border-cyber-border/50 flex items-center justify-between text-gray-400">
                    <span class="flex items-center gap-1.5 text-[11px] uppercase tracking-wider font-bold">
                        <i class="fa-solid fa-terminal text-cyber-green"></i> Python Terminal Stdout
                    </span>
                    <button id="clear-console-btn" class="hover:text-white text-[10px]">Clear Output</button>
                </div>
                
                <div id="console-output" class="flex-1 p-3 overflow-y-auto space-y-1 text-gray-300 leading-relaxed select-text">
                    <div class="text-gray-500">// Terminal output will appear here...</div>
                </div>
            </div>
        </aside>

    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // --- 1. THREE.JS 3D SCENE SETUP ---
        let scene, camera, renderer, controls;
        let pyObjects = []; // Stores meshes created by user scripts
        let mainCoreMesh = null;
        let particleSystem = null;
        let sceneLights = {};

        function init3D() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05070e);
            scene.fog = new THREE.FogExp2(0x05070e, 0.03);

            // Camera
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 5, 12);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 50;

            // Grid Floor
            const gridHelper = new THREE.GridHelper(30, 30, 0x00f0ff, 0x1e293b);
            gridHelper.position.y = -2;
            scene.add(gridHelper);

            // Lights
            sceneLights.ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(sceneLights.ambient);

            sceneLights.neonPoint = new THREE.PointLight(0x00f0ff, 3, 20);
            sceneLights.neonPoint.position.set(0, 4, 0);
            scene.add(sceneLights.neonPoint);

            sceneLights.pinkPoint = new THREE.PointLight(0xff0055, 3, 20);
            sceneLights.pinkPoint.position.set(-5, -1, 3);
            scene.add(sceneLights.pinkPoint);

            // Central Cyber Core Mesh
            createCentralCore();

            // Background Ambient Particles
            createCyberParticles();

            // Resize Event
            window.addEventListener('resize', onWindowResize);
        }

        function createCentralCore() {
            const group = new THREE.Group();

            const geo = new THREE.IcosahedronGeometry(1.5, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x00f0ff,
                wireframe: true,
                emissive: 0x00f0ff,
                emissiveIntensity: 0.5
            });

            mainCoreMesh = new THREE.Mesh(geo, mat);
            group.add(mainCoreMesh);

            const innerGeo = new THREE.OctahedronGeometry(0.8, 0);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            group.add(innerMesh);

            group.position.y = 1;
            scene.add(group);
        }

        function createCyberParticles() {
            const particleCount = 150;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 40;
                positions[i + 1] = Math.random() * 20 - 2;
                positions[i + 2] = (Math.random() - 0.5) * 40;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0x00f0ff,
                size: 0.08,
                transparent: true,
                opacity: 0.6
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        let rotationSpeed = 0.01;
        function animate() {
            requestAnimationFrame(animate);

            if (mainCoreMesh) {
                mainCoreMesh.rotation.x += rotationSpeed;
                mainCoreMesh.rotation.y += rotationSpeed * 1.5;
            }

            if (particleSystem) {
                particleSystem.rotation.y += 0.0005;
            }

            // Animate user created meshes if marked for animation
            pyObjects.forEach(obj => {
                if (obj.userData && obj.userData.autoRotate) {
                    obj.rotation.x += 0.01;
                    obj.rotation.y += 0.02;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // --- 2. PYTHON ENGINE (PYODIDE WASM) INTEGRATION & BINDINGS ---
        let pyodide = null;

        // Exposed JavaScript functions accessible directly inside Python
        window.cyber3D = {
            spawnCube: function(x, y, z, colorHex = '#00f0ff', size = 1) {
                const geo = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(colorHex),
                    roughness: 0.3,
                    metalness: 0.8
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.userData.autoRotate = true;
                scene.add(mesh);
                pyObjects.push(mesh);
                return pyObjects.length - 1;
            },

            spawnSphere: function(x, y, z, colorHex = '#ff0055', radius = 0.6) {
                const geo = new THREE.SphereGeometry(radius, 16, 16);
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(colorHex),
                    wireframe: true
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.userData.autoRotate = true;
                scene.add(mesh);
                pyObjects.push(mesh);
                return pyObjects.length - 1;
            },

            setCoreColor: function(colorHex) {
                if (mainCoreMesh) {
                    mainCoreMesh.material.color.set(colorHex);
                    mainCoreMesh.material.emissive.set(colorHex);
                }
            },

            setRotationSpeed: function(speed) {
                rotationSpeed = parseFloat(speed);
            },

            setLightColor: function(lightName, colorHex) {
                if (sceneLights[lightName]) {
                    sceneLights[lightName].color.set(colorHex);
                }
            },

            clearScene: function() {
                pyObjects.forEach(obj => scene.remove(obj));
                pyObjects = [];
            }
        };

        async function initPyodideEngine() {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const runBtn = document.getElementById('run-btn');

            try {
                pyodide = await loadPyodide();
                
                // Redirect Python stdout/stderr to our custom terminal
                pyodide.setStdout({
                    write: (str) => appendConsole(str, 'stdout')
                });
                pyodide.setStderr({
                    write: (str) => appendConsole(str, 'stderr')
                });

                // Inject initial Python helper wrapper module
                await pyodide.runPythonAsync(`
import js

def spawn_cube(x=0, y=0, z=0, color='#00f0ff', size=1):
    return js.cyber3D.spawnCube(x, y, z, color, size)

def spawn_sphere(x=0, y=0, z=0, color='#ff0055', radius=0.6):
    return js.cyber3D.spawnSphere(x, y, z, color, radius)

def set_color(color_hex):
    js.cyber3D.setCoreColor(color_hex)

def set_rotation_speed(speed):
    js.cyber3D.setRotationSpeed(speed)

def set_light(light_name, color_hex):
    js.cyber3D.setLightColor(light_name, color_hex)

def clear_scene():
    js.cyber3D.clearScene()
`);

                statusText.innerText = "Python 3.11 WASM Ready";
                statusText.classList.remove('text-gray-400');
                statusText.classList.add('text-cyber-neon');
                statusDot.classList.remove('bg-amber-500');
                statusDot.classList.add('bg-cyber-neon');
                runBtn.disabled = false;

                appendConsole("System: Python Engine initialized successfully.", "system");

            } catch (err) {
                statusText.innerText = "Engine Error";
                statusDot.classList.remove('bg-amber-500');
                statusDot.classList.add('bg-red-500');
                appendConsole("Engine Load Error: " + err.message, "stderr");
            }
        }

        // --- 3. EDITOR & TERMINAL UI CONTROLS ---
        const codeEditor = document.getElementById('code-editor');
        const lineNumbers = document.getElementById('line-numbers');
        const consoleOutput = document.getElementById('console-output');

        // Line Numbers Auto-Update
        function updateLineNumbers() {
            const lines = codeEditor.value.split('\n').length;
            lineNumbers.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
        }

        codeEditor.addEventListener('input', updateLineNumbers);

        // Handle Tab key in Textarea
        codeEditor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = codeEditor.selectionStart;
                const end = codeEditor.selectionEnd;
                codeEditor.value = codeEditor.value.substring(0, start) + "    " + codeEditor.value.substring(end);
                codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
                updateLineNumbers();
            }
        });

        function appendConsole(text, type = 'stdout') {
            if (!text.trim() && type === 'stdout') return;
            const div = document.createElement('div');
            
            if (type === 'stderr') {
                div.className = 'text-red-400 font-mono text-xs';
            } else if (type === 'system') {
                div.className = 'text-cyber-neon font-mono text-xs italic';
            } else {
                div.className = 'text-gray-300 font-mono text-xs';
            }
            
            div.innerText = text;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        document.getElementById('clear-console-btn').addEventListener('click', () => {
            consoleOutput.innerHTML = '';
        });

        document.getElementById('clear-scene-btn').addEventListener('click', () => {
            window.cyber3D.clearScene();
            appendConsole("System: 3D Scene cleared.", "system");
        });

        // Run Python Script Execution
        document.getElementById('run-btn').addEventListener('click', async () => {
            if (!pyodide) return;
            
            const code = codeEditor.value;
            appendConsole(`>>> Executing Python script...`, "system");

            try {
                await pyodide.runPythonAsync(code);
                appendConsole(`<<< Script finished execution.`, "system");
            } catch (err) {
                appendConsole(err.message, "stderr");
            }
        });

        // Preset Examples
        const examples = {
            matrix: `# Python 3D Cube Matrix Generator
clear_scene()
set_color("#00f0ff")
set_rotation_speed(0.02)

print("Building 3D Cube Grid...")
colors = ["#00f0ff", "#ff0055", "#7000ff", "#ffb700"]

count = 0
for x in range(-2, 3, 2):
    for z in range(-2, 3, 2):
        if x == 0 and z == 0:
            continue
        c = colors[count % len(colors)]
        spawn_cube(x, 0, z, color=c, size=0.8)
        count += 1

print(f"Spawned {count} interactive cubes!")`,

            rainbow: `# Rainbow Sphere Orbit Simulation
import math

clear_scene()
set_color("#ff0055")
set_rotation_speed(0.05)

print("Deploying Orbital Spheres...")
total_spheres = 12
radius = 4

for i in range(total_spheres):
    angle = (i / total_spheres) * 2 * math.pi
    x = math.cos(angle) * radius
    z = math.sin(angle) * radius
    
    # Alternate heights
    y = math.sin(i) * 1.5
    
    spawn_sphere(x, y, z, color="#00f0ff", radius=0.4)

print("Orbital spheres active.")`,

            wave: `# Futuristic Wave Pattern
import math

clear_scene()
set_color("#7000ff")
set_rotation_speed(0.005)

print("Generating 3D Wave Grid...")
grid_size = 5

for x in range(-grid_size, grid_size + 1):
    for z in range(-grid_size, grid_size + 1):
        dist = math.sqrt(x**2 + z**2)
        y = math.sin(dist * 0.8) * 1.2
        
        color = "#00ff66" if y > 0 else "#ff0055"
        spawn_cube(x * 1.2, y, z * 1.2, color=color, size=0.4)

print("Wave grid generated successfully!")`
        };

        window.loadExample = function(name) {
            if (examples[name]) {
                codeEditor.value = examples[name];
                updateLineNumbers();
            }
        };

        // Mobile panel toggle
        document.getElementById('toggle-editor-btn').addEventListener('click', () => {
            const panel = document.getElementById('editor-panel');
            panel.classList.toggle('translate-x-full');
        });

        // Initialize App on Window Load
        window.onload = () => {
            init3D();
            animate();
            loadExample('matrix');
            initPyodideEngine();
        };
    </script>
</body>
  </html>
