<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - Web chính</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0b0b1a;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span {
            font-size: 32px;
        }
        h1 {
            color: #ff0050;
            font-size: 24px;
        }
        h1 small {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: normal;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            transition: 0.3s;
            font-size: 14px;
        }
        .btn-primary {
            background: #ff0050;
        }
        .btn-primary:hover {
            opacity: 0.8;
        }
        .btn-success {
            background: #00c851;
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-admin {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: none;
        }
        .hidden {
            display: none !important;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 10px;
        }
        input:focus {
            border-color: #ff0050;
        }
        .auth-box {
            max-width: 400px;
            margin: 30px auto;
        }
        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            cursor: pointer;
        }
        .auth-tab.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .auth-form.active {
            display: flex;
        }
        .auth-error {
            color: #ff6b6b;
            font-size: 14px;
            min-height: 20px;
        }
        .auth-success {
            color: #69db7c;
            font-size: 14px;
            min-height: 20px;
        }
        .main-content {
            display: none;
        }
        .main-content.show {
            display: block;
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .input-group input {
            flex: 1;
            min-width: 200px;
            margin-bottom: 0;
        }
        .status {
            min-height: 24px;
            margin-bottom: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        .video-wrapper {
            display: none;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            margin-top: 12px;
        }
        .video-wrapper video {
            width: 100%;
            display: block;
            aspect-ratio: 9/16;
        }
        .video-wrapper.show {
            display: block;
        }
        .video-info {
            display: none;
            padding: 12px 0 8px;
        }
        .video-info.show {
            display: block;
        }
        .video-info .title {
            font-size: 18px;
            font-weight: 600;
        }
        .video-info .author {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        .actions {
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .actions.show {
            display: flex;
        }
        .actions .btn {
            flex: 1;
            min-width: 120px;
            text-align: center;
        }
        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .btn-inbox {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            display: none;
        }
        .btn-inbox .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff0050;
            color: #fff;
            border-radius: 50%;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 700;
            display: none;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1a1a2e;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            padding: 24px;
            overflow-y: auto;
        }
        .modal h2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 24px;
            cursor: pointer;
        }
        .message-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-left: 3px solid transparent;
        }
        .message-item.unread {
            border-left-color: #ff0050;
        }
        .message-item .msg-header {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 4px;
        }
        .message-item .msg-content {
            color: #fff;
        }
        .secret-info {
            background: rgba(0, 255, 100, 0.05);
            border: 1px solid rgba(0, 255, 100, 0.15);
            border-radius: 12px;
            padding: 8px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
        .secret-info strong {
            color: #69db7c;
        }
        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .input-group {
                flex-direction: column;
            }
            .input-group input {
                min-width: unset;
            }
            .actions .btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">
                <span>🎵</span>
                <h1>TikTok <span style="color:#00f2ea;">Downloader</span> <small>Web chính</small></h1>
            </div>
            <div>
                <button id="inboxBtn" class="btn btn-inbox">📩 Hộp thư <span class="badge" id="inboxBadge">0</span></button>
                <a href="https://ruanxue432-hash.github.io/cocai.chim.github.io/" target="_blank" id="adminLink" class="btn btn-admin">⚙️ Quản trị</a>
                <button id="logoutBtn" class="btn btn-outline hidden">🚪 Đăng xuất</button>
            </div>
        </div>

        <!-- Auth -->
        <div id="authSection" class="auth-box">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Đăng nhập</button>
                <button class="auth-tab" data-tab="register">Đăng ký</button>
            </div>
            <form id="loginForm" class="auth-form active">
                <input type="text" id="loginUser" placeholder="Tên đăng nhập" />
                <input type="password" id="loginPass" placeholder="Mật khẩu" />
                <div id="loginError" class="auth-error"></div>
                <button type="submit" class="btn btn-primary">🔑 Đăng nhập</button>
            </form>
            <form id="registerForm" class="auth-form">
                <input type="text" id="regUser" placeholder="Tên" />
                <input type="password" id="regPass" placeholder="Mật khẩu (>=4 ký tự)" />
                <input type="password" id="regConfirm" placeholder="Xác nhận" />
                <div id="regError" class="auth-error"></div>
                <div id="regSuccess" class="auth-success"></div>
                <button type="submit" class="btn btn-primary">📝 Đăng ký</button>
            </form>
        </div>

        <!-- Main -->
        <div id="mainContent" class="main-content">
            <div class="secret-info">
                🔑 <strong>Xác thực:</strong> Web chính gửi dữ liệu kèm secret để web trung gian nhận diện.
            </div>

            <div class="input-group">
                <input id="urlInput" placeholder="https://www.tiktok.com/@user/video/..." />
                <button id="fetchBtn" class="btn btn-primary">🔍 Lấy video</button>
            </div>
            <div id="status" class="status">Nhập link TikTok và nhấn "Lấy video"</div>
            <div id="videoWrapper" class="video-wrapper">
                <video id="videoPlayer" controls playsinline></video>
            </div>
            <div id="videoInfo" class="video-info">
                <div class="title" id="videoTitle"></div>
                <div class="author" id="videoAuthor"></div>
            </div>
            <div id="actions" class="actions">
                <button id="downloadBtn" class="btn btn-success">⬇️ Tải video</button>
                <button id="copyBtn" class="btn btn-outline">📋 Sao chép link</button>
            </div>
            <div class="footer">
                <span>⚡ Tải video không logo</span>
                <span>miễn phí</span>
            </div>
        </div>
    </div>

    <!-- Inbox Modal -->
    <div class="modal-overlay" id="inboxModal">
        <div class="modal">
            <h2><span>📩 Hộp thư</span><button class="modal-close" id="closeInbox">&times;</button></h2>
            <div id="inboxList"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        //  👇 CẤU HÌNH GITHUB GIST + SECRET KEY (GIỐNG WEB TRUNG GIAN)
        // ============================================================
        const GIST_ID = 'a5fc09ae4bbd3f069e2bb08a3102d5ba';
        const GITHUB_TOKEN = ' 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'; // ← Dán token vào đây
        const SECRET_KEY = 'mySuperSecretKey123'; // ← Đổi thành key bí mật giống web trung gian
        // ============================================================

        const GIST_URL = `https://api.github.com/gists/${GIST_ID}`;
        const HEADERS = {
            'Authorization': `Bearer ${GITHUB_TOKEN}`,
            'Accept': 'application/json'
        };

        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin123';

        // ---- Storage ----
        const USERS_KEY = 'tiktok_users';
        const SESSION_KEY = 'tiktok_session';

        function getUsers() {
            const data = localStorage.getItem(USERS_KEY);
            return data ? JSON.parse(data) : {};
        }

        function saveUsers(users) {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function getSession() {
            const data = localStorage.getItem(SESSION_KEY);
            return data ? JSON.parse(data) : null;
        }

        function setSession(s) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(s));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        // ---- Gist API ----
        async function fetchGist() {
            const res = await fetch(GIST_URL, { headers: HEADERS });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(`HTTP ${res.status}: ${err.message || res.statusText}`);
            }
            const data = await res.json();
            const content = data.files['data.json'].content;
            return JSON.parse(content);
        }

        async function updateGist(content) {
            const payload = {
                files: {
                    'data.json': {
                        content: JSON.stringify(content, null, 2)
                    }
                }
            };
            const res = await fetch(GIST_URL, {
                method: 'PATCH',
                headers: { ...HEADERS, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(`HTTP ${res.status}: ${err.message || res.statusText}`);
            }
            return true;
        }

        // ---- Auth ----
        function registerUser(username, password, confirm) {
            if (password !== confirm) return { ok: false, msg: 'Mật khẩu không khớp.' };
            if (password.length < 4) return { ok: false, msg: 'Mật khẩu >= 4 ký tự.' };
            if (username === ADMIN_USERNAME) return { ok: false, msg: 'Tên không được phép.' };
            const users = getUsers();
            if (users[username]) return { ok: false, msg: 'Tên đã tồn tại.' };
            users[username] = { password, role: 'user' };
            saveUsers(users);
            syncToGist();
            return { ok: true, msg: 'Đăng ký thành công!' };
        }

        function loginUser(username, password) {
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                setSession({ username, role: 'admin' });
                return { ok: true, role: 'admin' };
            }
            const users = getUsers();
            const user = users[username];
            if (!user || user.password !== password) {
                return { ok: false, msg: 'Sai tên hoặc mật khẩu.' };
            }
            setSession({ username, role: user.role || 'user' });
            return { ok: true, role: user.role || 'user' };
        }

        function logoutUser() {
            clearSession();
            location.reload();
        }

        // ---- Sync (có gửi kèm secret) ----
        let cachedData = null;

        async function syncToGist() {
            const users = getUsers();
            if (!users[ADMIN_USERNAME]) {
                users[ADMIN_USERNAME] = { password: ADMIN_PASSWORD, role: 'admin' };
            } else {
                users[ADMIN_USERNAME].role = 'admin';
            }
            const payload = {
                users: users,
                messages: cachedData?.messages || [],
                lastUpdated: Date.now(),
                _secret: SECRET_KEY // ✅ Gửi kèm secret để web trung gian xác thực
            };
            await updateGist(payload);
            cachedData = payload;
            showToast('☁️ Đã đồng bộ lên Gist');
        }

        async function fetchAndMerge() {
            try {
                const data = await fetchGist();
                cachedData = data;
                if (!data.users) data.users = {};
                if (!data.messages) data.messages = {};

                const localUsers = getUsers();
                let changed = false;
                for (const [username, info] of Object.entries(data.users)) {
                    if (username === ADMIN_USERNAME) continue;
                    if (!localUsers[username] || localUsers[username].role !== info.role) {
                        localUsers[username] = info;
                        changed = true;
                    }
                }
                if (changed) {
                    saveUsers(localUsers);
                    showToast('🔄 Đã cập nhật dữ liệu');
                }
                updateUI();
                return data;
            } catch (err) {
                showToast('❌ Lỗi đồng bộ: ' + err.message, true);
                return null;
            }
        }

        // ---- UI ----
        function updateUI() {
            const session = getSession();
            if (!session) return;
            const users = getUsers();
            const user = users[session.username];
            if (!user) {
                clearSession();
                location.reload();
                return;
            }
            const adminBtn = document.getElementById('adminLink');
            if (user.role === 'admin') {
                adminBtn.style.display = 'inline-flex';
            } else {
                adminBtn.style.display = 'none';
            }
            if (cachedData) {
                const msgs = cachedData.messages.filter(m => m.to === session.username && m.status === 'unread');
                const badge = document.getElementById('inboxBadge');
                const inboxBtn = document.getElementById('inboxBtn');
                if (msgs.length > 0) {
                    badge.textContent = msgs.length;
                    badge.style.display = 'inline';
                    inboxBtn.style.display = 'inline-flex';
                } else {
                    badge.style.display = 'none';
                    if (cachedData.messages.filter(m => m.to === session.username).length > 0) {
                        inboxBtn.style.display = 'inline-flex';
                    } else {
                        inboxBtn.style.display = 'none';
                    }
                }
            }
        }

        // ---- Inbox ----
        async function renderInbox() {
            const session = getSession();
            if (!session || !cachedData) return;
            const msgs = cachedData.messages.filter(m => m.to === session.username);
            const container = document.getElementById('inboxList');
            if (msgs.length === 0) {
                container.innerHTML = '<p style="color:rgba(255,255,255,0.3);">📭 Hộp thư trống</p>';
                return;
            }
            container.innerHTML = msgs.sort((a, b) => b.timestamp - a.timestamp).map(msg => {
                const isUnread = msg.status === 'unread';
                const isInvite = msg.type === 'invite_admin';
                const date = new Date(msg.timestamp).toLocaleString();
                return `
                    <div class="message-item ${isUnread ? 'unread' : ''}">
                        <div class="msg-header"><span>Từ: <strong>${msg.from}</strong></span><span>${date}</span></div>
                        <div class="msg-content">${msg.content}</div>
                        <div style="margin-top:6px;display:flex;gap:8px;">
                            ${isUnread ? `<button class="btn btn-outline btn-sm" onclick="markRead('${msg.id}')">📖 Đã đọc</button>` : ''}
                            ${isInvite && isUnread ? `<button class="btn btn-success btn-sm" onclick="acceptInvite('${msg.from}')">✅ Chấp nhận admin</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.markRead = async function(msgId) {
            if (!cachedData) return;
            const msg = cachedData.messages.find(m => m.id === msgId);
            if (msg) {
                msg.status = 'read';
                await updateGist(cachedData);
                renderInbox();
                updateUI();
                showToast('✅ Đã đánh dấu đã đọc');
            }
        };

        window.acceptInvite = async function(fromUser) {
            try {
                const users = getUsers();
                if (!users[fromUser]) return showToast('Không tìm thấy user', true);
                users[fromUser].role = 'admin';
                saveUsers(users);
                for (const msg of cachedData.messages) {
                    if (msg.from === fromUser && msg.type === 'invite_admin' && msg.to === getSession().username) {
                        msg.status = 'read';
                    }
                }
                await updateGist(cachedData);
                showToast(`✅ Bạn đã trở thành admin!`);
                updateUI();
                renderInbox();
                setTimeout(() => location.reload(), 1000);
            } catch (err) {
                showToast('❌ ' + err.message, true);
            }
        };

        // ---- Toast ----
        function showToast(msg, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.background = isError ? 'rgba(200,50,50,0.9)' : 'rgba(0,0,0,0.85)';
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ---- Video ----
        let currentVideoUrl = null;

        async function fetchTikTok(url) {
            let clean = url.trim();
            if (!clean.startsWith('http://') && !clean.startsWith('https://')) clean = 'https://' + clean;
            document.getElementById('fetchBtn').disabled = true;
            document.getElementById('fetchBtn').textContent = '⏳ Đang tải...';
            try {
                const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(clean)}`);
                if (!res.ok) throw new Error('Lỗi API');
                const data = await res.json();
                if (data.code !== 0 || !data.data) throw new Error(data.msg || 'Không tìm thấy video');
                const videoUrl = data.data.play || data.data.wmplay || data.data.hdplay;
                if (!videoUrl) throw new Error('Không có link video');
                currentVideoUrl = videoUrl;
                const player = document.getElementById('videoPlayer');
                player.src = videoUrl;
                player.load();
                document.getElementById('videoWrapper').classList.add('show');
                document.getElementById('videoInfo').classList.add('show');
                document.getElementById('videoTitle').textContent = data.data.title || 'Video TikTok';
                document.getElementById('videoAuthor').textContent = data.data.author?.unique_id || 'unknown';
                document.getElementById('actions').classList.add('show');
                document.getElementById('status').textContent = '✅ Đã tải thành công!';
                document.getElementById('status').style.color = '#69db7c';
            } catch (err) {
                document.getElementById('status').textContent = '❌ ' + err.message;
                document.getElementById('status').style.color = '#ff6b6b';
            } finally {
                document.getElementById('fetchBtn').disabled = false;
                document.getElementById('fetchBtn').textContent = '🔍 Lấy video';
            }
        }

        // ---- DOM Events ----
        document.addEventListener('DOMContentLoaded', function() {
            const session = getSession();
            if (session) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('mainContent').classList.add('show');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('status').textContent = '👋 Chào ' + session.username;
                fetchAndMerge().then(() => {
                    updateUI();
                    startPolling();
                });
            }

            // Auth tabs
            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                    document.getElementById(target + 'Form').classList.add('active');
                    document.getElementById('loginError').textContent = '';
                    document.getElementById('regError').textContent = '';
                    document.getElementById('regSuccess').textContent = '';
                });
            });

            // Login
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('loginUser').value.trim();
                const password = document.getElementById('loginPass').value.trim();
                const errEl = document.getElementById('loginError');
                if (!username || !password) {
                    errEl.textContent = 'Vui lòng nhập đầy đủ.';
                    return;
                }
                const result = loginUser(username, password);
                if (result.ok) {
                    errEl.textContent = '';
                    location.reload();
                } else {
                    errEl.textContent = result.msg;
                }
            });

            // Register
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('regUser').value.trim();
                const password = document.getElementById('regPass').value.trim();
                const confirm = document.getElementById('regConfirm').value.trim();
                const errEl = document.getElementById('regError');
                const successEl = document.getElementById('regSuccess');
                const result = registerUser(username, password, confirm);
                if (result.ok) {
                    successEl.textContent = result.msg;
                    errEl.textContent = '';
                    document.getElementById('regUser').value = '';
                    document.getElementById('regPass').value = '';
                    document.getElementById('regConfirm').value = '';
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('loginUser').value = username;
                    document.getElementById('loginPass').value = '';
                } else {
                    errEl.textContent = result.msg;
                    successEl.textContent = '';
                }
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', logoutUser);

            // Inbox
            document.getElementById('inboxBtn').addEventListener('click', function() {
                document.getElementById('inboxModal').classList.add('active');
                renderInbox();
            });
            document.getElementById('closeInbox').addEventListener('click', function() {
                document.getElementById('inboxModal').classList.remove('active');
            });
            document.getElementById('inboxModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });

            // Fetch video
            document.getElementById('fetchBtn').addEventListener('click', function() {
                const url = document.getElementById('urlInput').value.trim();
                if (!url) {
                    document.getElementById('status').textContent = '⚠️ Vui lòng nhập link TikTok.';
                    document.getElementById('status').style.color = '#ff6b6b';
                    return;
                }
                fetchTikTok(url);
            });
            document.getElementById('urlInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('fetchBtn').click();
            });

            // Download
            document.getElementById('downloadBtn').addEventListener('click', async function() {
                if (!currentVideoUrl) {
                    showToast('⚠️ Chưa có video', true);
                    return;
                }
                this.disabled = true;
                this.textContent = '⏳ Đang tải...';
                try {
                    const res = await fetch(currentVideoUrl);
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'tiktok_video.mp4';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    showToast('✅ Tải xuống hoàn tất!');
                } catch (err) {
                    showToast('❌ Lỗi tải: ' + err.message, true);
                } finally {
                    this.disabled = false;
                    this.textContent = '⬇️ Tải video';
                }
            });

            // Copy
            document.getElementById('copyBtn').addEventListener('click', function() {
                const link = document.getElementById('urlInput').value.trim();
                if (!link) { showToast('⚠️ Không có link', true); return; }
                navigator.clipboard.writeText(link)
                    .then(() => showToast('✅ Đã sao chép!'))
                    .catch(() => {
                        document.getElementById('urlInput').select();
                        document.execCommand('copy');
                        showToast('✅ Đã sao chép!');
                    });
            });

            // ---- Polling ----
            let pollInterval = null;

            function startPolling() {
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(async () => {
                    await fetchAndMerge();
                    updateUI();
                    if (document.getElementById('inboxModal').classList.contains('active')) {
                        renderInbox();
                    }
                }, 5000);
            }
        });
    </script>
</body>
    </html>
