<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Tool VIP Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #58a6ff;
      font-family: 'Consolas', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .box {
      width: 100%;
      max-width: 500px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,255,100,0.2);
    }
    h2 { color: #2ea043; text-align: center; margin-bottom: 15px; }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      border-radius: 6px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    #log {
      display: none;
      margin-top: 15px;
      background: #000;
      color: #00ff66;
      padding: 12px;
      border-radius: 6px;
      height: 160px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    #troll-popup {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95);
      color: #ff3333;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🚀 TOOL GET SOURCE CODE VIP</h2>
    <input type="text" id="target" placeholder="Nhập tên nạn nhân / link Facebook / GitHub...">
    <button onclick="startTroll()">BẮT ĐẦU HACK & LẤY DỮ LIỆU</button>
    <div id="log"></div>
  </div>

  <div id="troll-popup">
    <h1 style="font-size: 28px; margin-bottom: 15px;">⚠️ CẢNH BÁO: BỊ BẮT QUẢ TANG!</h1>
    <p style="color: #fff; font-size: 18px; margin-bottom: 10px;">Toàn bộ lịch sử duyệt web và ảnh dìm của bạn đã được gửi cho phụ huynh!</p>
    <p style="color: #ffff00; font-size: 20px; font-weight: bold;">🤣 ĐÙA TÝ THÔI! BẠN ĐÃ BỊ TROLL 100%!</p>
  </div>

  <script>
    function startTroll() {
      const target = document.getElementById('target').value.trim();
      if (!target) return alert('Nhập cái tên vào đã mày ơi!');

      const log = document.getElementById('log');
      log.style.display = 'block';
      log.innerHTML = '';

      const steps = [
        `[+] Đang kết nối tới máy chủ của ${target}...`,
        `[+] Vượt tường lửa thành công (Bypass Firewall)...`,
        `[+] Đang khai thác lỗ hổng Token GitHub...`,
        `[+] Đang trích xuất tin nhắn messenger thầm kín...`,
        `[+] Tải lên server 100%...`,
        `[!] HOÀN TẤT DỮ LIỆU!`
      ];

      let i = 0;
      const interval = setInterval(() => {
        if (i < steps.length) {
          log.innerHTML += steps[i] + '<br>';
          log.scrollTop = log.scrollHeight;
          i++;
        } else {
          clearInterval(interval);
          setTimeout(() => {
            document.getElementById('troll-popup').style.display = 'flex';
          }, 800);
        }
      }, 700);
    }
  </script>
</body>
</html>
